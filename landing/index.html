<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feel good inside and out</title>
    <!-- Inter font for matching main website -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            background: #fff;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 48px;
            background: #fff;
            position: relative;
            z-index: 2;
        }

        .navbar-logo {
            font-size: 2rem;
            font-family: 'Inter', Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .navbar-menu {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
        }

        .navbar-menu a {
            color: #111;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s;
        }

        .navbar-menu a:hover {
            color: #7c3aed;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .navbar-login {
            color: #111;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            margin-right: 8px;
        }

        .navbar-cta {
            background: #181820;
            color: #fff;
            border: none;
            border-radius: 28px;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .navbar-cta:hover {
            background: #33334d;
        }

        .hero {
            position: relative;
            width: 100vw;
            height: 80vh;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.85);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            margin-left: 7vw;
            max-width: 700px;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 700;
            color: #111;
            line-height: 1.05;
            margin: 0;
            letter-spacing: -0.03em;
        }

        @media (max-width: 900px) {
            .navbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px 8vw;
            }

            .navbar-menu {
                gap: 20px;
                font-size: 1rem;
            }

            .hero-content {
                margin-left: 4vw;
            }

            .hero-title {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 600px) {
            .hero {
                height: 50vh;
                min-height: 300px;
            }

            .hero-content {
                margin-left: 2vw;
            }

            .hero-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-logo">glo</div>
        <div class="navbar-menu">
            <a href="#">Styles</a>
            <a href="#">Schedule</a>
            <a href="#">Teachers</a>
            <a href="#">Intentional Living</a>
        </div>
        <div class="navbar-actions">
            <a href="#" class="navbar-login">Login</a>
            <button class="navbar-cta">Try free for 7 days</button>
        </div>
    </nav>
    <section class="hero">
        <img class="hero-bg" src="hero-bg.jpeg" alt="Yoga by the sea" />
        <div class="hero-content">
            <h1 class="hero-title">
                Feel good<br>inside and out
            </h1>
        </div>
    </section>
</body>

</html>
